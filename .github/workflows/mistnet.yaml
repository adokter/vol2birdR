on:
  push:
    branches:
      - main
      - agl-profile
      - fix_cran_builds

name: Mistnet

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # Only the Linux entry sets matrix.container. For every other platform this is empty,
    # which GitHub treats as "no container" and the job runs directly on the runner.
    container: ${{ matrix.container }}
    strategy:
      matrix:
        os: [windows-2022, ubuntu-latest, macos-15-intel, macos-latest]
        include:
          - os: windows-2022
            cuda: 0
            library: mistnet.dll
            test: 
            make: "& 'C:/Program Files/Microsoft Visual Studio/2022/Enterprise/MSBuild/Current/Bin/MSBuild' mistnet.sln /t:Build /p:Configuration=Release"
            build: build/Release
            cmakevars:
            libext: .dll
            exeext: .exe
            fixlib:
            flavor: Release
            artifacts: mistnet.dll
            upload: Windows        
          # The Linux artifact is built inside an Ubuntu 22.04 container rather than on
          # the runner directly, for backward compatibility: libmistnet.so records the
          # highest GLIBCXX symbol version of the toolchain that built it, and that is a
          # floor -- forward-compatible only. Built on 24.04 (GCC 13+) it requires
          # GLIBCXX_3.4.32, which cannot be dlopen'd on 22.04 hosts that top out at
          # 3.4.30. Built on 22.04 it loads on 22.04, 24.04 and Fedora alike.
          - os: ubuntu-latest
            container: ubuntu:22.04
            library: libmistnet.so
            test: 
            make: make
            build: build
            cmakevars:
            libext:
            exeext:
            fixlib: patchelf --set-rpath '$ORIGIN/.' libmistnet.so
            flavor: Release
            artifacts: libmistnet.so
            upload: Linux
          - os: macos-15-intel
            library: libmistnet.dylib
            test: 
            make: make
            build: build
            cmakevars:
            libext: .dylib
            exeext:
            fixlib: install_name_tool -add_rpath @loader_path/. libmistnet.dylib
            flavor: Release
            artifacts: libmistnet.dylib
            upload: macOS
          - os: macos-latest
            library: libmistnet.dylib
            test: 
            make: make
            build: build
            cmakevars:
            libext: .dylib
            exeext:
            fixlib: install_name_tool -add_rpath @loader_path/. libmistnet.dylib
            flavor: Release
            artifacts: libmistnet.dylib
            upload: macOS-arm64
    steps:
      # The ubuntu:22.04 image is bare: no compiler, cmake, git, unzip, patchelf or CA
      # certificates. Install these before checkout, since actions/checkout falls back
      # to a slower REST-API tarball download when git is absent. No sudo: the container
      # already runs as root. ca-certificates is required because mistnet/CMakeLists.txt
      # fetches libtorch with file(DOWNLOAD ... TLS_VERIFY ON).
      - name: Bootstrap container toolchain
        if: matrix.container != ''
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake git ca-certificates unzip patchelf
          cmake --version | head -1
          gcc --version | head -1
          patchelf --version

      - uses: actions/checkout@v5

      # All paths below are RELATIVE to the workspace. Do not reintroduce
      # ${{runner.workspace}} or ${{github.workspace}}: inside a container those expand
      # to the *host* path (/home/runner/work/...) in `run:` bodies, while
      # `working-directory:` is translated to the container mount (/__w/...). Mixing the
      # two is what broke the earlier container attempt -- the build dir was created at
      # the host path, then the next step failed to chdir to the container path with
      # "OCI runtime exec failed ... no such file or directory".
      - name: Create environment
        run: cmake -E make_directory build

      - name: Install patchelf
        if: startsWith(matrix.os, 'ubuntu') && matrix.container == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf

      # Reclaim space ahead of the ~170MB libtorch download and its multi-GB extraction.
      # /usr/share/dotnet belongs to the host image and is not mounted into the
      # container, so this is a no-op there; `|| true` keeps that from failing the job.
      - name: Free up disk space
        if: startsWith(matrix.os, 'ubuntu')
        run: rm -rf /usr/share/dotnet || true

      - name: Run cmake
        working-directory: build
        run: cmake -DCMAKE_BUILD_TYPE=${{matrix.flavor}} ${{ matrix.cmakevars }} ../mistnet

      - name: Run make
        working-directory: build
        run: ${{matrix.make}}

      - name: Fix library
        working-directory: build
        run: ${{matrix.fixlib}}

      - name: Install libs
        run: |
          mkdir artifacts
          cp -R ${{matrix.build}}/${{matrix.artifacts}} artifacts
          rm -r build

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{matrix.upload}}
          path: artifacts

  upload:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        name:
          [
            macOS,
            Linux,
            Windows,
            macOS-arm64
          ]
        include:
          - name: macOS
            artifact: macOS
            upload: macOS
            hw: cpu
          - name: Linux
            artifact: Linux
            upload: Linux
            hw: cpu
          - name: Windows
            artifact: Windows
            upload: Windows
            hw: cpu
          - name: macOS-arm64
            artifact: macOS-arm64
            upload: macOS-arm64
            hw: cpu
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.artifact }}
      - name: Display downloaded artifacts and zip
        run: ls -R && zip -j -qq -r ./${{ matrix.artifact }}.zip *
      - name: Upload to latest
        uses: keithweaver/aws-s3-github-action@v1.0.0
        with:
          command: cp
          source: ${{ matrix.artifact }}.zip
          destination: s3://vol2bird-builds/vol2birdr/${{ github.ref }}/latest/${{ matrix.upload }}-${{ matrix.hw }}.zip
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_region: us-east-1

