on:
  push:
    branches:
      - main
      - agl-profile
      - fix_cran_builds

name: Mistnet

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # Only the Linux entry sets matrix.container; for all other platforms this is
    # empty and the job runs directly on the runner as before.
    container: ${{ matrix.container }}
    strategy:
      matrix:
        os: [windows-2022, ubuntu-latest, macos-15-intel, macos-latest]
        include:
          - os: windows-2022
            cuda: 0
            library: mistnet.dll
            test:
            make: "& 'C:/Program Files/Microsoft Visual Studio/2022/Enterprise/MSBuild/Current/Bin/MSBuild' mistnet.sln /t:Build /p:Configuration=Release"
            build: build/Release
            cmakevars:
            libext: .dll
            exeext: .exe
            fixlib:
            flavor: Release
            artifacts: mistnet.dll
            upload: Windows
          # The Linux artifact is built inside an Ubuntu 22.04 container rather than
          # directly on the runner for backward compatibility. Specifically, libmistnet.so
          # records the highest GLIBCXX symbol version of the toolchain that built it.
          # A library built against GLIBCXX_3.4.32 (Ubuntu 24.04 / GCC 13+) cannot be
          # dlopen'd on Ubuntu 22.04, which provides at most GLIBCXX_3.4.30, whereas
          # one built against 3.4.30 loads fine on 22.04, 24.04 and Fedora alike.
          - os: ubuntu-latest
            container: ubuntu:22.04
            library: libmistnet.so
            test:
            make: make
            build: build
            cmakevars:
            libext:
            exeext:
            fixlib: patchelf --set-rpath '$ORIGIN/.' libmistnet.so
            flavor: Release
            artifacts: libmistnet.so
            upload: Linux
          - os: macos-15-intel
            library: libmistnet.dylib
            test:
            make: make
            build: build
            cmakevars:
            libext: .dylib
            exeext:
            fixlib: install_name_tool -add_rpath @loader_path/. libmistnet.dylib
            flavor: Release
            artifacts: libmistnet.dylib
            upload: macOS
          - os: macos-latest
            library: libmistnet.dylib
            test:
            make: make
            build: build
            cmakevars:
            libext: .dylib
            exeext:
            fixlib: install_name_tool -add_rpath @loader_path/. libmistnet.dylib
            flavor: Release
            artifacts: libmistnet.dylib
            upload: macOS-arm64
    steps:
      # The ubuntu:22.04 container is bare: no compiler, cmake, git, unzip or CA
      # certificates. Install the toolchain before checkout, because actions/checkout
      # falls back to a slower REST-API download when git is missing.
      - name: Bootstrap container toolchain
        if: matrix.container != ''
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake git ca-certificates unzip patchelf
          patchelf --version
          cmake --version | head -1
          gcc --version | head -1

      - uses: actions/checkout@v3

      - name: Create environment
        run: cmake -E make_directory ${{runner.workspace}}/build

      # Only needed when building directly on the runner; the container image
      # installs patchelf in the bootstrap step above.
      - name: Install patchelf
        if: startsWith(matrix.os, 'ubuntu') && matrix.container == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf

      # Reclaim space before the ~170MB libtorch download and its multi-GB extraction.
      # This ran on the host previously; inside the container /usr/share/dotnet is not
      # visible, so the equivalent host path is mounted-in and cleared instead. The
      # container shares the runner's underlying disk, so this still frees real space.
      - name: Free up disk space
        if: startsWith(matrix.os, 'ubuntu')
        run: rm -rf /__w/_tool/dotnet /usr/share/dotnet || true

      - name: Run cmake
        working-directory: ${{runner.workspace}}/build
        run: cmake -DCMAKE_BUILD_TYPE=${{matrix.flavor}} ${{ matrix.cmakevars }} ${{github.workspace}}/mistnet

      - name: Run make
        working-directory: ${{runner.workspace}}/build
        run: ${{matrix.make}}

      - name: Fix library
        working-directory: ${{runner.workspace}}/build
        run: ${{matrix.fixlib}}

      - name: Install libs
        working-directory: ${{runner.workspace}}
        run: |
          mkdir artifacts
          cp -R ${{matrix.build}}/${{matrix.artifacts}} artifacts
          rm -r build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{matrix.upload}}
          path: ${{runner.workspace}}/artifacts

  upload:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        name:
          [
            macOS,
            Linux,
            Windows,
            macOS-arm64
          ]
        include:
          - name: macOS
            artifact: macOS
            upload: macOS
            hw: cpu
          - name: Linux
            artifact: Linux
            upload: Linux
            hw: cpu
          - name: Windows
            artifact: Windows
            upload: Windows
            hw: cpu
          - name: macOS-arm64
            artifact: macOS-arm64
            upload: macOS-arm64
            hw: cpu
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
      - name: Display downloaded artifacts and zip
        run: ls -R && zip -j -qq -r ./${{ matrix.artifact }}.zip *
      - name: Upload to latest
        uses: keithweaver/aws-s3-github-action@v1.0.0
        with:
          command: cp
          source: ${{ matrix.artifact }}.zip
          destination: s3://vol2bird-builds/vol2birdr/${{ github.ref }}/latest/${{ matrix.upload }}-${{ matrix.hw }}.zip
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_region: us-east-1

