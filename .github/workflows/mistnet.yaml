on:
  push:
    branches:
      - main
      - agl-profile
      - fix_cran_builds

name: Mistnet

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # Only the Linux entry sets matrix.container. For every other platform this is empty,
    # which GitHub treats as "no container" and the job runs directly on the runner.
    container: ${{ matrix.container }}
    strategy:
      matrix:
        os: [windows-2022, ubuntu-latest, macos-15-intel, macos-latest]
        # No single LibTorch version covers every platform, so version is a real matrix
        # dimension and the impossible pairings are excluded below. 2.1.2 exists here
        # solely because it is the last release with an x86_64 macOS build.
        libtorch: ["1.12.1", "2.1.2", "2.14.0"]
        exclude:
          - { os: windows-2022, libtorch: "2.1.2" }
          - { os: ubuntu-latest, libtorch: "2.1.2" }
          - { os: macos-latest, libtorch: "2.1.2" }
          - { os: macos-15-intel, libtorch: "2.14.0" }
        include:
          # Suffix appended to artifact names, matching the existing `_1_10_2`
          # convention. 1.12.1 stays UNVERSIONED: released versions of the package
          # already fetch `Linux-cpu.zip` and friends, so renaming those would break
          # installs in the wild.
          - libtorch: "1.12.1"
            tag: ""
          - libtorch: "2.1.2"
            tag: "_2_1_2"
          - libtorch: "2.14.0"
            tag: "_2_14_0"
          - os: windows-2022
            cuda: 0
            library: mistnet.dll
            test: 
            make: "& 'C:/Program Files/Microsoft Visual Studio/2022/Enterprise/MSBuild/Current/Bin/MSBuild' mistnet.sln /t:Build /p:Configuration=Release"
            build: build/Release
            cmakevars:
            libext: .dll
            exeext: .exe
            fixlib:
            flavor: Release
            artifacts: mistnet.dll
            upload: Windows        
          # The Linux artifact is built inside an Ubuntu 22.04 container rather than on
          # the runner directly, for backward compatibility.
          - os: ubuntu-latest
            container: ubuntu:22.04
            library: libmistnet.so
            test: 
            make: make
            build: build
            cmakevars:
            libext:
            exeext:
            fixlib: patchelf --set-rpath '$ORIGIN/.' libmistnet.so
            flavor: Release
            artifacts: libmistnet.so
            upload: Linux
          - os: macos-15-intel
            library: libmistnet.dylib
            test: 
            make: make
            build: build
            cmakevars:
            libext: .dylib
            exeext:
            fixlib: install_name_tool -add_rpath @loader_path/. libmistnet.dylib
            flavor: Release
            artifacts: libmistnet.dylib
            upload: macOS
          - os: macos-latest
            library: libmistnet.dylib
            test: 
            make: make
            build: build
            cmakevars:
            libext: .dylib
            exeext:
            fixlib: install_name_tool -add_rpath @loader_path/. libmistnet.dylib
            flavor: Release
            artifacts: libmistnet.dylib
            upload: macOS-arm64
    steps:
      # Add basic tools to The ubuntu:22.04 image
      - name: Bootstrap container toolchain
        if: matrix.container != ''
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake git ca-certificates unzip patchelf
          cmake --version | head -1
          gcc --version | head -1
          patchelf --version

      - uses: actions/checkout@v5

      # All paths below are RELATIVE to the workspace.
      - name: Create environment
        run: cmake -E make_directory build

      - name: Install patchelf
        if: startsWith(matrix.os, 'ubuntu') && matrix.container == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf

      # Reclaim space ahead of the ~170MB libtorch download and its multi-GB extraction.
      # /usr/share/dotnet belongs to the host image and is not mounted into the
      # container, so this is a no-op there; `|| true` keeps that from failing the job.
      - name: Free up disk space
        if: startsWith(matrix.os, 'ubuntu')
        run: rm -rf /usr/share/dotnet || true

      - name: Run cmake
        working-directory: build
        run: cmake -DCMAKE_BUILD_TYPE=${{matrix.flavor}} "-DLIBTORCH_VERSION=${{matrix.libtorch}}" ${{ matrix.cmakevars }} ../mistnet

      - name: Run make
        working-directory: build
        run: ${{matrix.make}}

      - name: Fix library
        working-directory: build
        run: ${{matrix.fixlib}}

      - name: Install libs
        run: |
          mkdir artifacts
          cp -R ${{matrix.build}}/${{matrix.artifacts}} artifacts
          rm -r build

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{matrix.upload}}${{matrix.tag}}
          path: artifacts

  upload:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # One entry per artifact the build job actually produces, so this list must be
        # kept in step with the build matrix and its excludes. `artifact` is the
        # upload-artifact name; `dest` is the S3 filename, where the version suffix
        # follows `-cpu` to match the existing `Linux-cpu_1_10_2.zip` convention.
        # The unsuffixed names are LibTorch 1.12.1 and must stay that way -- released
        # versions of the package fetch them by that exact name.
        include:
          - { artifact: macOS, dest: macOS-cpu }
          - { artifact: Linux, dest: Linux-cpu }
          - { artifact: Windows, dest: Windows-cpu }
          - { artifact: macOS-arm64, dest: macOS-arm64-cpu }
          - { artifact: macOS_2_1_2, dest: macOS-cpu_2_1_2 }
          - { artifact: Linux_2_14_0, dest: Linux-cpu_2_14_0 }
          - { artifact: Windows_2_14_0, dest: Windows-cpu_2_14_0 }
          - { artifact: macOS-arm64_2_14_0, dest: macOS-arm64-cpu_2_14_0 }
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.artifact }}
      - name: Display downloaded artifacts and zip
        run: ls -R && zip -j -qq -r ./${{ matrix.artifact }}.zip *
      - name: Upload to latest
        uses: keithweaver/aws-s3-github-action@v1.0.0
        with:
          command: cp
          source: ${{ matrix.artifact }}.zip
          destination: s3://vol2bird-builds/vol2birdr/${{ github.ref }}/latest/${{ matrix.dest }}.zip
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_region: us-east-1

